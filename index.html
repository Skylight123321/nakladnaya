<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Калькулятор"><meta name="referrer" content="no-referrer">
<title>Калькулятор</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="vault.css">
</head><body>
<main id="calculator" aria-label="Калькулятор">
 <div class="calc-top"><button id="calculatorMenu" aria-label="Настройки калькулятора">···</button></div>
 <div class="calc-display"><div id="expression" aria-hidden="true"></div><output id="display" aria-live="polite">0</output></div>
 <div class="calc-keys">
  <button data-key="AC" class="utility">AC</button><button data-key="±" class="utility">±</button><button data-key="%" class="utility">%</button><button data-key="÷" class="operator">÷</button>
  <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="×" class="operator">×</button>
  <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="−" class="operator">−</button>
  <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="+" class="operator">+</button>
  <button data-key="0" class="zero">0</button><button data-key=",">,</button><button data-key="=" class="operator">=</button>
 </div><p id="vaultStatus" role="status" aria-live="polite"></p>
</main>
<div id="appHost" hidden></div>
<dialog id="vaultDialog"><form id="vaultForm" method="dialog"><div class="dialog-head"><h1 id="dialogTitle"></h1><button id="closeVaultDialog" type="button" aria-label="Закрыть">×</button></div><div id="dialogBody"></div><p id="dialogError" role="alert"></p><button id="dialogSubmit" class="primary" type="submit">Продолжить</button></form></dialog>
<noscript>Включите JavaScript для работы калькулятора.</noscript>
<script src="vault-crypto.js"></script><script src="vault-store.js"></script><script src="vault-shell.js"></script>
</body></html>
