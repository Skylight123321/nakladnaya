<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F2A4A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Накладная" />
  <title>Накладная</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#111827; --danger:#b91c1c; --jaan-blue:#0F2A4A; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--text)}
    .app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 28px)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.title{font-size:28px;font-weight:800;letter-spacing:-.02em}.sub{font-size:13px;color:var(--muted);margin-top:3px}.shop-info{text-align:center;color:var(--muted);font-size:11px;line-height:1.45;margin-top:10px;padding-bottom:2px}
    .top-actions{display:flex;gap:8px;align-items:center}.icon-btn{width:42px;height:42px;padding:0;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;display:grid;place-items:center}.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.icon-btn:active{background:#f3f4f6}.icon-btn.primary-icon{background:var(--jaan-blue);color:#fff;border-color:var(--jaan-blue)}.icon-btn.has-comment{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 12px rgba(15,23,42,.04)}
    .customer-wrap{margin-bottom:12px}.customer-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.customer-wrap label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px 2px}.customer{font-size:16px}
    .row{display:grid;grid-template-columns:1.3fr .7fr .9fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)} .row:last-child{border-bottom:0}
    input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:#fff;outline:none} input:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(17,24,39,.06)}
    .sum{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}.del{border:0;background:#fff;color:var(--danger);font-size:22px;width:38px;height:38px;border-radius:10px}.del:active{background:#fee2e2}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}#addBtn{background:var(--jaan-blue);color:#fff} button{font:inherit;border:0;border-radius:14px;padding:13px 14px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
    .total{margin-top:14px;background:var(--jaan-blue);color:#fff;border-radius:18px;padding:18px;display:flex;align-items:end;justify-content:space-between;gap:12px}.total-label{font-size:13px;color:#cbd5e1}.total-value{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.count{font-size:13px;color:#cbd5e1;text-align:right}
    .headers{display:grid;grid-template-columns:1.3fr .7fr .9fr 38px;gap:8px;color:var(--muted);font-size:11px;padding:0 0 6px;text-transform:uppercase;letter-spacing:.04em}.empty{color:var(--muted);text-align:center;padding:22px 8px}
    .search-wrap{margin-bottom:12px}.search-wrap input{background:#fff}.comment-area{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;outline:none}.comment-area:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(17,24,39,.06)}.comment-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat-label{font-size:12px;color:var(--muted);font-weight:700}.stat-value{font-size:22px;font-weight:800;margin-top:6px}.stat-count{font-size:12px;color:var(--muted);margin-top:4px}.history-comment{font-size:12px;color:#4b5563;margin-top:7px;line-height:1.35}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:#f6f7f9;width:min(760px,100%);max-height:88vh;border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 18px);overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sheet-title{font-size:22px;font-weight:800}.close{background:#e5e7eb;padding:8px 12px}.history-list{display:grid;gap:10px}.history-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.history-main{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.history-name{font-weight:800;font-size:16px}.history-meta{font-size:12px;color:var(--muted);margin-top:3px}.history-total{font-weight:800;white-space:nowrap}.history-buttons{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:11px}.history-buttons button{padding:10px;font-size:13px}.danger{color:var(--danger);background:#fff;border:1px solid #fecaca}.no-history{text-align:center;color:var(--muted);padding:28px 10px}
    .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:560px){.stats-grid{grid-template-columns:1fr}.customer-line{grid-template-columns:1fr auto}.headers{display:none}.row{grid-template-columns:1fr 74px 104px 38px}.title{font-size:25px}.card{padding:10px}.sum{grid-column:1/4;text-align:left;color:var(--muted);font-size:14px;padding-left:2px}.del{grid-column:4;grid-row:1/3}.actions{grid-template-columns:1fr}.total-value{font-size:27px}.history-buttons{grid-template-columns:1fr 1fr auto}}
  
    .print-choice{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;align-items:flex-end;justify-content:center}
    .print-choice.show{display:flex}
    .print-sheet{width:min(620px,100%);background:#f6f7f9;border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 18px)}
    .print-sheet h3{margin:2px 2px 14px;font-size:22px}
    .print-paper-row,.print-action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .print-paper-row button{background:#fff;border:1px solid var(--line)}
    .print-paper-row button.active{background:#111827;color:#fff;border-color:#111827}
    .print-server{margin:12px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
    .print-cancel{width:100%;margin-top:10px;background:#e5e7eb;color:#111827}

  
    .print-health{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700;background:#eef1f5;color:#4b5563}
    .print-health.ok{background:#ecfdf5;color:#047857}
    .print-health.bad{background:#fef2f2;color:#b91c1c}
    .print-health.warn{background:#fffbeb;color:#92400e}

  </style>

</head>
<body>
  <main class="app">
    <div class="top"><div><div class="title">Накладная</div><div class="sub" id="currentDate"></div></div><div class="top-actions">
      <button class="icon-btn primary-icon" id="saveBtn" aria-label="Сохранить накладную" title="Сохранить накладную"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg></button>
      <button class="icon-btn" id="printBtn" aria-label="Печать" title="Печать накладной"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg></button>
      <button class="icon-btn" id="historyBtn" aria-label="История" title="История"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
      <button class="icon-btn" id="statsBtn" aria-label="Статистика" title="Статистика"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    </div></div>
    <section class="card">
      <div class="customer-wrap"><div class="customer-line"><div><label for="customerName">Имя получателя</label><input class="customer" id="customerName" placeholder="Например, Анна" autocomplete="off" /></div><button class="icon-btn" id="commentBtn" aria-label="Комментарий" title="Комментарий"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 8h8M8 12h5"/></svg></button></div></div>
      <div class="headers"><div>Товар</div><div>Кол-во</div><div>Цена</div><div></div></div>
      <div id="items"></div>
      <div class="actions">
        <button class="primary" id="addBtn">+ Добавить позицию</button>
        <button class="secondary" id="clearBtn">Очистить всё</button>
      </div>
    </section>
    <section class="total">
      <div><div class="total-label">Итого</div><div class="total-value" id="grandTotal">0,00</div></div>
      <div class="count" id="countText">0 позиций</div>
    </section>
    <div class="shop-info">Jaan<br>пав.609, 12 ряд</div>
  </main>

  <div class="modal" id="historyModal" aria-hidden="true"><div class="sheet"><div class="sheet-head"><div class="sheet-title">История накладных</div><button class="close" id="closeHistory">Закрыть</button></div><div class="search-wrap"><input id="historySearch" placeholder="Поиск по имени, дате, товару или комментарию" autocomplete="off" /></div><div class="history-list" id="historyList"></div></div></div>
  <div class="modal" id="commentModal" aria-hidden="true"><div class="sheet"><div class="sheet-head"><div class="sheet-title">Комментарий</div><button class="close" id="closeComment">Закрыть</button></div><textarea class="comment-area" id="commentText" placeholder="Например: оплатит завтра, скидка, заберёт вечером…"></textarea><div class="comment-actions"><button class="secondary" id="clearComment">Очистить</button><button class="primary" id="saveComment">Готово</button></div></div></div>
  <div class="modal" id="statsModal" aria-hidden="true"><div class="sheet"><div class="sheet-head"><div class="sheet-title">Статистика</div><button class="close" id="closeStats">Закрыть</button></div><div class="stats-grid"><div class="stat-card"><div class="stat-label">Сегодня</div><div class="stat-value" id="statToday">0,00</div><div class="stat-count" id="statTodayCount">0 накладных</div></div><div class="stat-card"><div class="stat-label">7 дней</div><div class="stat-value" id="statWeek">0,00</div><div class="stat-count" id="statWeekCount">0 накладных</div></div><div class="stat-card"><div class="stat-label">Этот месяц</div><div class="stat-value" id="statMonth">0,00</div><div class="stat-count" id="statMonthCount">0 накладных</div></div></div></div></div>

  <div class="print-choice" id="printChoice" aria-hidden="true">
    <div class="print-sheet">
      <h3>Печать накладной</h3>
      <div class="print-paper-row">
        <button type="button" id="paperA5">A5</button>
        <button type="button" id="paperA4">A4</button>
      </div>
      <div class="print-server">Сервер: <span id="printServerText"></span></div>
      <div class="print-health" id="printHealth">Проверяю сервер…</div>
      <div class="print-action-row">
        <button type="button" class="secondary" id="changePrintServer">Изменить IP / адрес</button>
        <button type="button" class="primary" id="confirmPrint">Распечатать</button>
      </div>
      <button type="button" class="print-cancel" id="cancelPrint">Отмена</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='invoice-calc-items-v1';
const NAME_KEY='invoice-calc-customer-v1';
const HISTORY_KEY='invoice-calc-history-v1';
const COMMENT_KEY='invoice-calc-comment-v1';
const PRINT_SERVER_KEY='jaan-print-server-url-v5';
const DEFAULT_PRINT_SERVER='http://jaan-print.local:8765';
const PRINT_PAPER_KEY='jaan-print-paper-v1';
let items=[];
let history=[];
let currentComment='';
const elItems=document.getElementById('items'), elTotal=document.getElementById('grandTotal'), elCount=document.getElementById('countText'), elDate=document.getElementById('currentDate'), elName=document.getElementById('customerName');
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORAGE_KEY));
    items=Array.isArray(raw)?raw.filter(i=>i&&typeof i==='object'):[];
  }catch{items=[]}
  if(!items.length)items=[{id:uid(),name:'',qty:'',price:''}];
  items=items.map(i=>{
    const safe={id:i.id||uid(),name:String(i.name??''),qty:String(i.qty??''),price:String(i.price??'')};
    if(!safe.name&&!safe.price&&safe.qty==='1')safe.qty='';
    return safe;
  });
  elName.value=localStorage.getItem(NAME_KEY)||'';
  try{
    const raw=JSON.parse(localStorage.getItem(HISTORY_KEY));
    history=Array.isArray(raw)?raw.filter(inv=>inv&&typeof inv==='object').map(inv=>({
      ...inv,items:Array.isArray(inv.items)?inv.items.filter(i=>i&&typeof i==='object'):[]
    })):[];
  }catch{history=[]}
  currentComment=localStorage.getItem(COMMENT_KEY)||'';
  updateCommentButton();
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(items)); localStorage.setItem(NAME_KEY,elName.value); localStorage.setItem(COMMENT_KEY,currentComment)}
function saveHistory(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}
function money(n){return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number.isFinite(n)?n:0)}
function plural(n){const a=n%10,b=n%100; if(a===1&&b!==11)return 'позиция'; if(a>=2&&a<=4&&(b<10||b>=20))return 'позиции'; return 'позиций'}
function parseNum(v){return parseFloat(String(v).replace(',','.'))||0}
function totalOf(list){return (Array.isArray(list)?list:[]).reduce((a,i)=>a+parseNum(i&&i.qty)*parseNum(i&&i.price),0)}
function render(){
  elItems.innerHTML='';
  items.forEach(item=>{
    const row=document.createElement('div'); row.className='row'; row.dataset.id=item.id;
    row.innerHTML=`<input class="name" placeholder="Название" value="${escapeHtml(item.name)}" />
      <input class="qty" inputmode="decimal" type="text" placeholder="Количество" value="${escapeHtml(item.qty)}" />
      <input class="price" inputmode="decimal" type="text" placeholder="0,00" value="${escapeHtml(item.price)}" />
      <button class="del" aria-label="Удалить">×</button>
      <div class="sum">Сумма: ${money(parseNum(item.qty)*parseNum(item.price))}</div>`;
    elItems.appendChild(row);
  });
  updateTotal(); save();
}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function updateTotal(){const t=totalOf(items);elTotal.textContent=money(t);elCount.textContent=`${items.length} ${plural(items.length)}`}
function dateText(date=new Date()){return date.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1800)}
elItems.addEventListener('input',e=>{const row=e.target.closest('.row'); if(!row)return; const item=items.find(i=>i.id===row.dataset.id); if(!item)return; if(e.target.classList.contains('name'))item.name=e.target.value; if(e.target.classList.contains('qty'))item.qty=e.target.value; if(e.target.classList.contains('price'))item.price=e.target.value; row.querySelector('.sum').textContent='Сумма: '+money(parseNum(item.qty)*parseNum(item.price)); updateTotal(); save();});
elItems.addEventListener('click',e=>{if(!e.target.classList.contains('del'))return; const id=e.target.closest('.row').dataset.id; items=items.filter(i=>i.id!==id); if(!items.length)items=[{id:uid(),name:'',qty:'',price:''}]; render();});
elName.addEventListener('input',save);
document.getElementById('addBtn').addEventListener('click',()=>{items.push({id:uid(),name:'',qty:'',price:''});render(); setTimeout(()=>elItems.lastElementChild?.querySelector('.name')?.focus(),0)});
document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('Очистить все позиции, имя и комментарий?')){items=[{id:uid(),name:'',qty:'',price:''}];elName.value='';currentComment='';updateCommentButton();render()}});

function currentSnapshot(){
  const cleanItems=items.filter(i=>String(i.name).trim() || parseNum(i.qty) || parseNum(i.price)).map(i=>({name:String(i.name||'').trim(),qty:String(i.qty||''),price:String(i.price||'')}));
  return {id:uid(),dateISO:new Date().toISOString(),date:dateText(),customer:elName.value.trim(),comment:currentComment.trim(),items:cleanItems,total:totalOf(cleanItems)};
}
document.getElementById('saveBtn').addEventListener('click',async()=>{
  const inv=currentSnapshot();
  if(!inv.items.length){
    alert('Добавьте хотя бы одну заполненную позицию.');
    return;
  }

  history.unshift(inv);
  saveHistory();
  renderHistory();
  renderStats();
  toast('Сохранено');

  await saveInvoiceToServer(inv);
});

function normalizePrintServer(raw){
  let v=String(raw||'').trim().replace(/\/$/,'');
  if(v && !/^https?:\/\//i.test(v))v='http://'+v;
  return v;
}

async function checkPrintServerHealth(base,timeoutMs=1800){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const r=await fetch(base+'/health?ts='+Date.now(),{
      method:'GET',cache:'no-store',signal:ctrl.signal
    });
    clearTimeout(timer);
    if(!r.ok)return {ok:false,reason:'HTTP '+r.status};
    const data=await r.json().catch(()=>({ok:true}));
    return {ok:!!data.ok,data};
  }catch(e){
    clearTimeout(timer);
    return {ok:false,reason:(e&&e.name==='AbortError')?'timeout':'blocked_or_unreachable'};
  }
}

function encodePrintBridgePayload(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  let binary='';
  for(const b of bytes)binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}


async function saveInvoiceToServer(inv){
  const base=normalizePrintServer(localStorage.getItem(PRINT_SERVER_KEY)||DEFAULT_PRINT_SERVER);

  if(location.protocol==='https:' && /^http:\/\//i.test(base)){
    const url=base+'/save-bridge#data='+encodePrintBridgePayload(inv);
    const w=window.open(url,'_blank');
    if(!w){
      alert('Safari заблокировал окно сохранения. Разрешите всплывающие окна и попробуйте ещё раз.');
      return false;
    }
    return true;
  }

  try{
    const r=await fetch(base+'/save-excel',{
      method:'POST',
      headers:{'Content-Type':'application/json; charset=utf-8'},
      body:JSON.stringify(inv),
      cache:'no-store'
    });
    const body=await r.json().catch(()=>({}));
    if(!r.ok || body.ok===false)throw new Error(body.error||('HTTP '+r.status));
    return true;
  }catch(e){
    alert('Накладная сохранена в историю на iPhone, но Excel на ПК сохранить не удалось. Проверьте сервер и адрес.');
    return false;
  }
}

async function sendToPrintServer(inv,paper){
  let base=normalizePrintServer(localStorage.getItem(PRINT_SERVER_KEY)||DEFAULT_PRINT_SERVER);
  if(!base)base=DEFAULT_PRINT_SERVER;
  localStorage.setItem(PRINT_SERVER_KEY,base);

  const payload={...inv,paper_size:(paper==='A4'?'A4':'A5')};

  // GitHub Pages is HTTPS while the local Windows server is HTTP.
  // Safari may block fetch as mixed content, so use the proven top-level
  // navigation fallback with UTF-8 JSON encoded as URL-safe base64.
  if(location.protocol==='https:' && /^http:\/\//i.test(base)){
    const url=base+'/print-bridge#data='+encodePrintBridgePayload(payload);
    const w=window.open(url,'_blank');
    if(!w){
      alert('Safari заблокировал окно печати. Разрешите всплывающие окна для приложения и попробуйте ещё раз.');
      return false;
    }
    toast('Отправлено на печать: '+payload.paper_size);
    return true;
  }

  try{
    const r=await fetch(base+'/print',{
      method:'POST',
      headers:{'Content-Type':'application/json; charset=utf-8'},
      body:JSON.stringify(payload),
      cache:'no-store'
    });
    if(!r.ok){
      const body=await r.text();
      throw new Error(body||('HTTP '+r.status));
    }
    toast('Отправлено на печать: '+payload.paper_size);
    return true;
  }catch(e){
    alert('Не удалось связаться с компьютером. Проверьте Jaan Print Server и адрес сервера в настройках печати.');
    return false;
  }
}
const printChoice=document.getElementById('printChoice');
const paperA5=document.getElementById('paperA5');
const paperA4=document.getElementById('paperA4');
const printServerText=document.getElementById('printServerText');
let selectedPaper=(localStorage.getItem(PRINT_PAPER_KEY)==='A4'?'A4':'A5');

function refreshPrintChoice(){
  paperA5.classList.toggle('active',selectedPaper==='A5');
  paperA4.classList.toggle('active',selectedPaper==='A4');
  printServerText.textContent=normalizePrintServer(localStorage.getItem(PRINT_SERVER_KEY)||DEFAULT_PRINT_SERVER);
}

async function refreshPrintHealth(){
  const box=document.getElementById('printHealth');
  if(!box)return;
  const base=normalizePrintServer(localStorage.getItem(PRINT_SERVER_KEY)||DEFAULT_PRINT_SERVER);
  box.className='print-health';
  box.textContent='Проверяю сервер…';
  const h=await checkPrintServerHealth(base);
  if(h.ok){
    box.className='print-health ok';
    box.textContent='Сервер доступен'+(h.data&&h.data.printer?' · '+h.data.printer:'');
  }else if(location.protocol==='https:' && /^http:\/\//i.test(base)){
    box.className='print-health warn';
    box.textContent='Safari не разрешил фоновую проверку. Печать всё равно можно попробовать.';
  }else{
    box.className='print-health bad';
    box.textContent='Сервер недоступен. Проверьте ПК, Wi‑Fi и адрес.';
  }
}

function openPrintChoice(){
  const inv=currentSnapshot();
  if(!inv.items.length){alert('Добавьте хотя бы одну заполненную позицию.');return}
  refreshPrintChoice();
  refreshPrintHealth();
  printChoice.classList.add('show');
  printChoice.setAttribute('aria-hidden','false');
}
function closePrintChoice(){
  printChoice.classList.remove('show');
  printChoice.setAttribute('aria-hidden','true');
}
paperA5.addEventListener('click',()=>{selectedPaper='A5';localStorage.setItem(PRINT_PAPER_KEY,'A5');refreshPrintChoice()});
paperA4.addEventListener('click',()=>{selectedPaper='A4';localStorage.setItem(PRINT_PAPER_KEY,'A4');refreshPrintChoice()});
document.getElementById('changePrintServer').addEventListener('click',()=>{
  const current=normalizePrintServer(localStorage.getItem(PRINT_SERVER_KEY)||DEFAULT_PRINT_SERVER);
  const entered=prompt(`Адрес сервера печати.

Например:
http://jaan-print.local:8765

или:
http://192.168.31.137:8765`,current);
  if(entered===null)return;
  const base=normalizePrintServer(entered);
  if(base)localStorage.setItem(PRINT_SERVER_KEY,base);
  refreshPrintChoice();
  refreshPrintHealth();
});
document.getElementById('cancelPrint').addEventListener('click',closePrintChoice);
printChoice.addEventListener('click',e=>{if(e.target===printChoice)closePrintChoice()});
document.getElementById('confirmPrint').addEventListener('click',async()=>{
  const btn=document.getElementById('confirmPrint');
  const inv=currentSnapshot();
  btn.disabled=true;
  const old=btn.textContent;
  btn.textContent='Отправляю…';
  try{
    const ok=await sendToPrintServer(inv,selectedPaper);
    if(ok)closePrintChoice();
  }finally{
    btn.disabled=false;
    btn.textContent=old;
  }
});
document.getElementById('printBtn').addEventListener('click',openPrintChoice);

const modal=document.getElementById('historyModal');
const commentModal=document.getElementById('commentModal');
const statsModal=document.getElementById('statsModal');
const historySearch=document.getElementById('historySearch');
function updateCommentButton(){document.getElementById('commentBtn')?.classList.toggle('has-comment',!!currentComment.trim())}
document.getElementById('commentBtn').addEventListener('click',()=>{document.getElementById('commentText').value=currentComment;commentModal.classList.add('show');commentModal.setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('commentText').focus(),80)});
document.getElementById('closeComment').addEventListener('click',closeComment);
document.getElementById('saveComment').addEventListener('click',()=>{currentComment=document.getElementById('commentText').value.trim();updateCommentButton();save();closeComment();toast(currentComment?'Комментарий добавлен':'Комментарий пуст')});
document.getElementById('clearComment').addEventListener('click',()=>{document.getElementById('commentText').value='';currentComment='';updateCommentButton();save();});
commentModal.addEventListener('click',e=>{if(e.target===commentModal)closeComment()});
function closeComment(){commentModal.classList.remove('show');commentModal.setAttribute('aria-hidden','true')}
document.getElementById('statsBtn').addEventListener('click',()=>{renderStats();statsModal.classList.add('show');statsModal.setAttribute('aria-hidden','false')});
document.getElementById('closeStats').addEventListener('click',closeStats);statsModal.addEventListener('click',e=>{if(e.target===statsModal)closeStats()});
function closeStats(){statsModal.classList.remove('show');statsModal.setAttribute('aria-hidden','true')}
function invDate(inv){const d=inv.dateISO?new Date(inv.dateISO):null;return d&&!isNaN(d)?d:null}
function statsFor(filter){const rows=history.filter(inv=>{const d=invDate(inv);return d&&filter(d)});return {sum:rows.reduce((a,x)=>a+(Number(x.total)||totalOf(x.items||[])),0),count:rows.length}}
function renderStats(){const now=new Date(),startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()),startWeek=new Date(startToday);startWeek.setDate(startWeek.getDate()-6);const startMonth=new Date(now.getFullYear(),now.getMonth(),1);const t=statsFor(d=>d>=startToday),w=statsFor(d=>d>=startWeek),m=statsFor(d=>d>=startMonth);document.getElementById('statToday').textContent=money(t.sum);document.getElementById('statTodayCount').textContent=t.count+' '+pluralInvoice(t.count);document.getElementById('statWeek').textContent=money(w.sum);document.getElementById('statWeekCount').textContent=w.count+' '+pluralInvoice(w.count);document.getElementById('statMonth').textContent=money(m.sum);document.getElementById('statMonthCount').textContent=m.count+' '+pluralInvoice(m.count)}
function pluralInvoice(n){const a=n%10,b=n%100;if(a===1&&b!==11)return 'накладная';if(a>=2&&a<=4&&(b<10||b>=20))return 'накладные';return 'накладных'}
historySearch.addEventListener('input',renderHistory);
document.getElementById('historyBtn').addEventListener('click',()=>{renderHistory();modal.classList.add('show');modal.setAttribute('aria-hidden','false')});
document.getElementById('closeHistory').addEventListener('click',closeHistory);
modal.addEventListener('click',e=>{if(e.target===modal)closeHistory()});
function closeHistory(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
function renderHistory(){
  const list=document.getElementById('historyList'); list.innerHTML='';
  const q=(historySearch?.value||'').trim().toLowerCase();
  const shown=history.filter(inv=>!q || [inv.customer,inv.date,inv.comment,...(inv.items||[]).map(i=>i.name)].join(' ').toLowerCase().includes(q));
  if(!shown.length){list.innerHTML='<div class="no-history">'+(history.length?'Ничего не найдено.':'Сохранённых накладных пока нет.')+'</div>';return}
  shown.forEach(inv=>{
    const card=document.createElement('div');card.className='history-card';
    card.innerHTML=`<div class="history-main"><div><div class="history-name">${escapeHtml(inv.customer||'Без имени')}</div><div class="history-meta">${escapeHtml(inv.date||dateText(new Date(inv.dateISO)))} · ${(inv.items||[]).length} ${plural((inv.items||[]).length)}</div>${inv.comment?`<div class="history-comment">${escapeHtml(inv.comment)}</div>`:''}</div><div class="history-total">${money(Number(inv.total)||totalOf(inv.items||[]))}</div></div><div class="history-buttons"><button class="secondary open-inv" data-id="${inv.id}">Открыть</button><button class="primary photo-inv" data-id="${inv.id}">Фото</button><button class="danger delete-inv" data-id="${inv.id}">×</button></div>`;
    list.appendChild(card);
  });
}
document.getElementById('historyList').addEventListener('click',async e=>{
  const id=e.target.dataset.id;if(!id)return;const inv=history.find(x=>x.id===id);if(!inv)return;
  if(e.target.classList.contains('open-inv')){elName.value=inv.customer||'';currentComment=inv.comment||'';updateCommentButton();items=(inv.items||[]).map(i=>({id:uid(),...i}));if(!items.length)items=[{id:uid(),name:'',qty:'',price:''}];render();closeHistory();toast('Накладная открыта')}
  if(e.target.classList.contains('photo-inv')){await exportInvoice(inv)}
  if(e.target.classList.contains('delete-inv')){if(confirm('Удалить эту накладную из истории?')){history=history.filter(x=>x.id!==id);saveHistory();renderHistory();renderStats()}}
});

function wrapText(ctx,text,maxWidth){const words=String(text||'').split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines.length?lines:['—']}
async function invoiceBlob(inv){
  const invoiceItems=Array.isArray(inv?.items)?inv.items:[];
  const scale=2, W=900, pad=64, rowGap=22;
  const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');
  ctx.font='36px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
  let bodyH=0;invoiceItems.forEach(i=>{const lines=wrapText(ctx,i.name||'Товар',390);bodyH+=Math.max(74,lines.length*38+24)+rowGap});
  const H=Math.max(1180,430+bodyH+250);canvas.width=W*scale;canvas.height=H*scale;ctx.scale(scale,scale);
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#111827';ctx.font='700 54px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText('Накладная',pad,92);
  ctx.fillStyle='#6b7280';ctx.font='30px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText(inv.date||dateText(new Date(inv.dateISO)),pad,140);
  let y=205;
  ctx.fillStyle='#111827';ctx.font='700 29px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText('Получатель',pad,y);ctx.font='34px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText(inv.customer||'—',pad,y+48);y+=105;if(inv.comment){ctx.fillStyle='#6b7280';ctx.font='700 24px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText('Комментарий',pad,y);ctx.fillStyle='#111827';ctx.font='27px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';const cl=wrapText(ctx,inv.comment,W-pad*2);cl.slice(0,4).forEach((line,idx)=>ctx.fillText(line,pad,y+38+idx*34));y+=55+Math.min(cl.length,4)*34;}
  ctx.strokeStyle='#e5e7eb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();y+=42;
  ctx.fillStyle='#6b7280';ctx.font='700 22px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText('ТОВАР',pad,y);ctx.fillText('КОЛ-ВО',505,y);ctx.fillText('ЦЕНА',630,y);ctx.fillText('СУММА',760,y);y+=35;
  for(const i of invoiceItems){
    const lines=wrapText(ctx,i.name||'Товар',390);const rowH=Math.max(74,lines.length*38+24);
    ctx.fillStyle='#111827';ctx.font='30px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';lines.forEach((line,idx)=>ctx.fillText(line,pad,y+35+idx*38));
    ctx.font='28px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText(String(i.qty||'—'),505,y+35);ctx.fillText(money(parseNum(i.price)),630,y+35);ctx.font='700 28px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText(money(parseNum(i.qty)*parseNum(i.price)),760,y+35);
    y+=rowH;ctx.strokeStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();y+=rowGap;
  }
  y+=18;ctx.fillStyle='#0f172a';roundRect(ctx,pad,y,W-pad*2,140,24);ctx.fill();ctx.fillStyle='#cbd5e1';ctx.font='27px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText('Итого',pad+30,y+45);ctx.fillStyle='#fff';ctx.font='800 50px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText(money(Number(inv.total)||totalOf(invoiceItems)),pad+30,y+105);
  y+=205;ctx.textAlign='center';ctx.fillStyle='#6b7280';ctx.font='24px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText('Jaan',W/2,y);ctx.font='21px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillText('пав.609, 12 ряд',W/2,y+34);ctx.textAlign='start';
  return new Promise(resolve=>canvas.toBlob(resolve,'image/png',1));
}
function roundRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
async function exportInvoice(inv){
  const blob=await invoiceBlob(inv);if(!blob){alert('Не удалось создать изображение.');return}
  const safe=(inv.customer||'nakladnaya').replace(/[^a-zA-Zа-яА-Я0-9_-]+/g,'_');const file=new File([blob],`nakladnaya_${safe}_${(inv.date||'').replace(/\./g,'-')}.png`,{type:'image/png'});
  try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Накладная'});return}}catch(e){if(e.name==='AbortError')return}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Фото создано');
}
function updateDate(){elDate.textContent=dateText();}
updateDate();load();render();renderHistory();renderStats();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
