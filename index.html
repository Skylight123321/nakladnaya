<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calculator"><meta name="referrer" content="no-referrer">
<title>Calculator</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-ios27-180.png"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="vault.css?v=12.1.0">
</head><body>
<main id="calculator" aria-label="Калькулятор">
 <div class="calc-top">
  <button id="calculatorHistory" type="button" aria-label="История вычислений" title="История вычислений"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 5.4v7H6.7"/></svg></button>
  <button id="calculatorMenu" type="button" aria-label="Меню калькулятора" title="Меню калькулятора"><svg viewBox="0 0 24 28" fill="currentColor" aria-hidden="true"><rect x="4" y="1" width="16" height="26" rx="3.4"/><rect x="6" y="3.2" width="12" height="6.7" rx="1.4" fill="#111"/><g fill="#111"><circle cx="7.6" cy="14" r="1.55"/><circle cx="12" cy="14" r="1.55"/><circle cx="16.4" cy="14" r="1.55"/><circle cx="7.6" cy="18.5" r="1.55"/><circle cx="12" cy="18.5" r="1.55"/><circle cx="16.4" cy="18.5" r="1.55"/><circle cx="7.6" cy="23" r="1.55"/><circle cx="12" cy="23" r="1.55"/><circle cx="16.4" cy="23" r="1.55"/></g></svg></button>
 </div>
 <div class="calc-display"><div id="expression" aria-hidden="true"></div><output id="display" aria-live="polite">0</output></div>
 <div class="calc-keys">
  <button type="button" data-key="Backspace" class="utility backspace" aria-label="Удалить символ"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 10h18a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H19a4 4 0 0 1-3-1.3L5 25.5a2.2 2.2 0 0 1 0-3L16 11.3A4 4 0 0 1 19 10Z"/><path d="m21 18 12 12m0-12L21 30"/></svg></button>
  <button type="button" data-key="AC" class="utility" aria-label="Очистить всё"><span>AC</span></button>
  <button type="button" data-key="%" class="utility" aria-label="Процент"><span>%</span></button>
  <button type="button" data-key="÷" class="operator" aria-label="Разделить"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 24h28"/><circle cx="24" cy="13" r="2.6" fill="currentColor" stroke="none"/><circle cx="24" cy="35" r="2.6" fill="currentColor" stroke="none"/></svg></button>
  <button type="button" data-key="7" class="" aria-label="7"><span>7</span></button>
  <button type="button" data-key="8" class="" aria-label="8"><span>8</span></button>
  <button type="button" data-key="9" class="" aria-label="9"><span>9</span></button>
  <button type="button" data-key="×" class="operator" aria-label="Умножить"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 14 20 20m0-20L14 34"/></svg></button>
  <button type="button" data-key="4" class="" aria-label="4"><span>4</span></button>
  <button type="button" data-key="5" class="" aria-label="5"><span>5</span></button>
  <button type="button" data-key="6" class="" aria-label="6"><span>6</span></button>
  <button type="button" data-key="−" class="operator" aria-label="Вычесть"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 24h28"/></svg></button>
  <button type="button" data-key="1" class="" aria-label="1"><span>1</span></button>
  <button type="button" data-key="2" class="" aria-label="2"><span>2</span></button>
  <button type="button" data-key="3" class="" aria-label="3"><span>3</span></button>
  <button type="button" data-key="+" class="operator" aria-label="Прибавить"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 24h28M24 10v28"/></svg></button>
  <button type="button" data-key="±" class="" aria-label="Сменить знак"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 38 23-28M7 18h12M13 12v12M29 34h12"/></svg></button>
  <button type="button" data-key="0" class="zero" aria-label="0"><span>0</span></button>
  <button type="button" data-key="," class="decimal" aria-label="Десятичная запятая"><span>,</span></button>
  <button type="button" data-key="=" class="operator" aria-label="Равно"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18h24M12 30h24"/></svg></button>
 </div><p id="vaultStatus" role="status" aria-live="polite"></p>
</main>
<div id="appHost" hidden></div>
<dialog id="vaultDialog"><form id="vaultForm" method="dialog"><div class="dialog-head"><h1 id="dialogTitle"></h1><button id="closeVaultDialog" type="button" aria-label="Закрыть">×</button></div><div id="dialogBody"></div><p id="dialogError" role="alert"></p><button id="dialogSubmit" class="primary" type="submit">Продолжить</button></form></dialog>
<noscript>Включите JavaScript для работы калькулятора.</noscript>
<script src="viewport.js"></script><script src="vault-crypto.js"></script><script src="vault-store.js"></script><script src="vault-cloud.js"></script><script src="vault-shell.js"></script>
</body></html>
